[project]
name = "jarvis-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "google-api-python-client>=2.140",
  "google-auth>=2.30",
  "google-auth-oauthlib>=1.2",
  "mcp>=1.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]
voice = ["openwakeword>=0.6", "onnxruntime>=1.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis_core", "jarvis_google"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
